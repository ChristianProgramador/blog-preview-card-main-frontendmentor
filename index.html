<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card Main</title>
    <link rel="shortcut icon" href="./rsc/css/images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./rsc/css/variables.css">
    <link rel="stylesheet" href="./rsc/css/reset.css">
    <link rel="stylesheet" href="./rsc/css/style.css">
    <link rel="stylesheet" href="./rsc/css/responsive.css">
</head>

<body>

    <main>
        <article class="card">
            <img src="./rsc/images/illustration-article.svg" alt="imagem de uma ilustração de um artigo">

            <div class="card-content">
                <span>Learning</span>
                <p class="date">Published 21 Dec 2023</p>
                <h1>
                    <a href="#">HTML & CSS foundations</a>
                </h1>
                <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
            </div>
            <footer class="author-info">
                <img src="./rsc/images/image-avatar.webp" alt="Avatar do autor do artigo">
                <p>Greg Hooper</p>
            </footer>
        </article>
    </main>

</body>

</html>
